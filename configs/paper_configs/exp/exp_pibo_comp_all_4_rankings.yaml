# Run with: python -m momfpriors.plotting.merge_rank_plots --from_yaml configs/paper_configs/exp/exp_pibo_comp_all_4_rankings.yaml
yaml_files:
  - configs/paper_configs/exp/exp_pibo_comp_overall.yaml
  - configs/paper_configs/exp/exp_pibo_comp_all_good.yaml
  - configs/paper_configs/exp/exp_pibo_comp_mixed.yaml
  - configs/paper_configs/exp/exp_pibo_comp_all_bad.yaml
output_dir: /home/soham/Master_Thesis/ICLR_27/plots/exp/
save_suffix: exp_pibo_comp_all_rankings
file_type: pdf
figsize:
  - 40
  - 7
sub_labels:
  - Overall
  - All priors good
  - Mixed priors
  - All priors bad
