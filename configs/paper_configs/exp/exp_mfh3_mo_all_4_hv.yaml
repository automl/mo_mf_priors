# Run with: python -m momfpriors.plotting.merge_hv_plots --from_yaml configs/paper_configs/exp/exp_mfh3_mo_all_4_hv.yaml
yaml_files:
  - configs/paper_configs/exp/exp_mfh3_good_mo_hv.yaml
  - configs/paper_configs/exp/exp_mfh3_bad_mo_hv.yaml
  - configs/paper_configs/exp/exp_mfh3_moderate_mo_hv.yaml
  - configs/paper_configs/exp/exp_mfh3_terrible_mo_hv.yaml
output_dir: /home/soham/Master_Thesis/ICLR_27/plots/exp/
save_suffix: exp_mfh3_mo_all_4_hv
file_type: pdf
figsize:
  - 40 # 4 plots * 10 width each
  - 7
sub_labels:
  - Good
  - Bad
  - Moderate
  - Terrible
remove_prior_annots: true
cut_off_iteration: 20
tight_layout: false
wspace: 0.2
